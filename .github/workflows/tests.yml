name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install fastapi==0.133.1 pydantic==2.13.4
      - name: Python unit tests (live Hermes and CLI probes opt-in)
        run: python -m unittest discover -s tests -v
      - name: Web UI behavior
        run: node --test tests/test_ui.cjs
      - name: Desktop UI behavior
        run: node --experimental-vm-modules --test tests/test_desktop.cjs
      - name: JavaScript syntax
        run: |
          node --check dashboard/dist/index.js
          node --input-type=module --check < desktop/plugin.js
